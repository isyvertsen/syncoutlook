name: Image
# Tester og bygger imaget. Push til master legger det i GHCR som main-<run_number> (sorterbar, for Flux
# på gigabyte, se isyvertsen/gigabyte-infra apps/fsyncoutlook) og sha-<kort>.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python 3.12 --with-requirements requirements.txt python -m unittest -v

  bygg:
    needs: test
    runs-on: ubuntu-latest
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ghcr.io/isyvertsen/syncoutlook:main-${{ github.run_number }}
            ghcr.io/isyvertsen/syncoutlook:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
