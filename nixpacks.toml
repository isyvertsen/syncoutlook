[phases.setup]
nixPkgs = ["python312", "curl"]

[phases.install]
cmds = [
    "curl -LsSf https://astral.sh/uv/install.sh | sh",
    "/root/.local/bin/uv venv /opt/venv",
    "/root/.local/bin/uv pip install --python /opt/venv/bin/python -r requirements.txt"
]

[start]
cmd = "bash -c 'chmod +x /app/docker-entrypoint.sh && /app/docker-entrypoint.sh'"


# Sikkerhet: nixpacks-basen (ubuntu:24.04) har utdaterte OS-pakker, bl.a. sudo (CVE-2025-32463)
# og git (CVE-2025-48384), begge på CISA KEV. Oppgrader alle Ubuntu-pakker ved hver bygging.
[phases.os-security]
dependsOn = ["setup"]
cmds = ["apt-get update && DEBIAN_FRONTEND=noninteractive apt-get -y upgrade && rm -rf /var/lib/apt/lists/*"]
